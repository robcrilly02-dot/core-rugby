  <meta name="mobile-web-app-capable" content="yes">

<body class="selection:bg-emerald-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SHA-256 HASHING VIA WEB CRYPTO API ---
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // --- SVG ICONS ---
    const ShieldIcon = () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4z"/></svg>;
    const TrophyIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M8 21h8m-4-4v4m-6-12a4 4 0 00-4-4H2v3a7 7 0 007 7h1a7 7 0 007-7V5h-2a4 4 0 00-4 4"/></svg>;
    const FlameIcon = () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 23c-4.97 0-9-3.58-9-8 0-4.19 3.03-7.6 6.96-9.67.4-.21.89.08.89.53 0 2.21 1.79 4 4 4s4-1.79 4-4c0-.45.49-.74.89-.53C19.97 7.4 23 10.81 23 15c0 4.42-4.03 8-9 8z"/></svg>;
    const DropletsIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>;
    const DumbbellIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M6.5 6.5h11M6.5 17.5h11M2 12h20M4 9v6M20 9v6M8 6v12M16 6v12"/></svg>;
    const UserIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const ZapIcon = () => <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>;
    const PlusIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>;
    const CheckIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="3"><path d="M5 13l4 4L19 7"/></svg>;
    const DownloadIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>;
    const LinkIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>;
    const LockIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>;
    const LogOutIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
    const ActivityIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>;

    // --- AGE-GROUP PROGRAMMING & SAFETY DATABASE ---
    const AGE_GROUPS = {
      U12: {
        label: 'Under 12 (Ages 11-12)',
        focus: 'Movement Mastery & Bodyweight Fundamentals',
        safety: 'Bodyweight and light bands only. Focus on safe tackle posture and core control.',
        tackleSafe: 'TackleSafe: Head placement on ring craft side, tight core, active shoulder.',
        headcase: 'RFU Headcase: IF IN DOUBT, SIT THEM OUT. Minimum 23 days Graduated Return to Play.',
        hydrationBase: 1800,
        nutrition: {
          training: '300-400g complex carbs, 1.2g/kg protein. Whole fruits & dairy post-session.',
          match: 'Carb-focused breakfast (oats/banana), light pre-match energy snack 1h before.'
        },
        exercises: [
          { name: 'Bear Crawls & Crab Walks', category: 'Core & Neck Stability', reps: '3 sets x 15m', xp: 50 },
          { name: 'Slalom Cone Agility Drills', category: 'Agility & Footwork', reps: '4 sets x 5 turns', xp: 60 },
          { name: 'Bodyweight Squat to Jump', category: 'Power & Acceleration', reps: '3 sets x 8 reps', xp: 50 },
          { name: 'Aerobic Tag / Shuttle Games', category: 'Aerobic Capacity', reps: '10 mins continuous', xp: 70 }
        ]
      },
      U14: {
        label: 'Under 14 (Ages 13-14)',
        focus: 'Speed Mechanics, Dynamic Strength & Aerobic Prep',
        safety: 'Introduce isometric neck holds and light resistance bands. Collision prep focus.',
        tackleSafe: 'TackleSafe Focus: Cheek-to-cheek contact, wrap arms, drive through feet.',
        headcase: 'RFU Headcase: Post-concussion rest mandatory. No activity until 14 days symptom-free.',
        hydrationBase: 2200,
        nutrition: {
          training: '400-500g complex carbs, 1.4g/kg protein. Hydrate with electrolyte mix on warm days.',
          match: 'High carb prep 24h prior (pasta/rice/chicken), easy carbs 90 mins prior.'
        },
        exercises: [
          { name: '4-Way Isometric Neck Holds', category: 'Scrum/Tackle Safety', reps: '3 sets x 12 sec hold', xp: 60 },
          { name: 'Bronco Prep Shuttles (20-40-60m)', category: 'Aerobic Capacity', reps: '3 rounds (2 min rest)', xp: 80 },
          { name: 'Broad Jump & Controlled Landing', category: 'Explosive Power', reps: '4 sets x 5 jumps', xp: 60 },
          { name: 'Resistance Band Rows & Push-ups', category: 'Upper Body Armor', reps: '3 sets x 10 reps', xp: 70 }
        ]
      },
      U16: {
        label: 'Under 16 (Ages 15-16)',
        focus: 'Hypertrophy, Aerobic Power & High-Speed Running',
        safety: 'Structured strength work under supervision. Strict technique checks.',
        tackleSafe: 'Neck Armor: Build trapezius & neck strength to absorb collision forces.',
        headcase: 'RFU Headcase: Strict GRTP protocol. Mandatory doctor clearance before match play.',
        hydrationBase: 2600,
        nutrition: {
          training: '500-600g complex carbs, 1.6g/kg protein spread across 4 meals.',
          match: 'Carb load day before (+20% intake). Sip 500ml electrolyte mix 2h prior.'
        },
        exercises: [
          { name: 'Full Bronco Test Simulation', category: 'Aerobic Power', reps: '1 Max Effort Set (< 5:15)', xp: 120 },
          { name: 'Scrum Bridges & Neck Resistance', category: 'Collision Prep', reps: '4 sets x 20 sec', xp: 80 },
          { name: '40m Sprint Accelerations', category: 'Top-End Speed', reps: '5 sets (Full recovery)', xp: 90 },
          { name: 'Goblet Squats & Dumbbell RDLs', category: 'Strength & Armor', reps: '4 sets x 8-10 reps', xp: 100 }
        ]
      },
      U18: {
        label: 'Under 18 (Ages 17-18)',
        focus: 'Max Power, RSA (Repeat Sprint) & Collision Armor',
        safety: 'High intensity loading. Prioritize post-match recovery protocols.',
        tackleSafe: 'Collision Readiness: High-density shoulder/neck work. Strict RTP protocol.',
        headcase: 'RFU Headcase: Full GRTP adherence. Baseline cognitive & balance checks.',
        hydrationBase: 3000,
        nutrition: {
          training: '600g+ complex carbs, 1.8g/kg protein. Precision meal timing.',
          match: 'Matchday -3h meal (chicken, rice, cooked veggies). Intra-match hydration.'
        },
        exercises: [
          { name: 'RSA Shuttle Interval Repeats', category: 'Game Speed Fitness', reps: '6 sets x 30s work / 30s rest', xp: 110 },
          { name: 'Trap Bar Deadlift / Cleans', category: 'Max Power Output', reps: '4 sets x 5 reps', xp: 110 },
          { name: 'Collision Simulation Drills', category: 'Tackle/Scrum Armor', reps: '4 sets x 45 sec', xp: 100 },
          { name: 'Banded Neck & Shoulder Shrugs', category: 'Concussion Mitigation', reps: '3 sets x 15 reps', xp: 80 }
        ]
      }
    };

    const BADGES = [
      { id: 'b1', name: 'Front Row Fortress', desc: 'Log 5 Neck & Core sessions', icon: '🛡️' },
      { id: 'b2', name: 'Hydration Hero', desc: 'Reach 100% daily water target 3x', icon: '💧' },
      { id: 'b3', name: 'Bronco Beast', desc: 'Complete a full Bronco Test', icon: '⚡' },
      { id: 'b4', name: 'Streak Master', desc: 'Maintain a 5-day training streak', icon: '🔥' }
    ];

    function App() {
      // --- USER STORE IN LOCALSTORAGE ---
      const [users, setUsers] = useState(() => {
        try {
          const saved = localStorage.getItem('core_rugby_users');
          return saved ? JSON.parse(saved) : {};
        } catch(e) { return {}; }
      });

      const [currentUsername, setCurrentUsername] = useState(() => {
        try { return localStorage.getItem('core_rugby_active_user') || null; }
        catch(e) { return null; }
      });

      const [webhookUrl, setWebhookUrl] = useState(() => {
        try { return localStorage.getItem('core_rugby_webhook') || ''; }
        catch(e) { return ''; }
      });

      // --- AUTHENTICATION STATE ---
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'signup'
      const [authInput, setAuthInput] = useState({ username: '', password: '', name: '', ageGroup: 'U14', position: 'Back' });
      const [authError, setAuthError] = useState('');

      // --- MAIN APP STATE ---
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'workout', 'nutrition', 'profile'
      const [completedExercises, setCompletedExercises] = useState({});
      const [workoutRpe, setWorkoutRpe] = useState(7);
      const [workoutDuration, setWorkoutDuration] = useState(45);
      const [showWebhookModal, setShowWebhookModal] = useState(false);
      const [xpNotice, setXpNotice] = useState({ show: false, amount: 0, title: '' });
      const [syncStatus, setSyncStatus] = useState(null);

      // Save users database to localStorage whenever modified
      useEffect(() => {
        try { localStorage.setItem('core_rugby_users', JSON.stringify(users)); } catch(e){}
      }, [users]);

      // Save active session
      useEffect(() => {
        try {
          if (currentUsername) localStorage.setItem('core_rugby_active_user', currentUsername);
          else localStorage.removeItem('core_rugby_active_user');
        } catch(e){}
      }, [currentUsername]);

      useEffect(() => {
        try { localStorage.setItem('core_rugby_webhook', webhookUrl); } catch(e){}
      }, [webhookUrl]);

      const currentUser = currentUsername ? users[currentUsername] : null;
      const currentAgeData = currentUser ? (AGE_GROUPS[currentUser.ageGroup] || AGE_GROUPS.U14) : AGE_GROUPS.U14;

      // User progression math
      const userLevel = currentUser ? Math.min(Math.floor(currentUser.xp / 250) + 1, 10) : 1;
      const currentLevelXp = currentUser ? (currentUser.xp % 250) : 0;

      // --- AUTHENTICATION HANDLERS ---
      const handleSignUp = async (e) => {
        e.preventDefault();
        setAuthError('');
        const uname = authInput.username.trim().toLowerCase();
        if (!uname || !authInput.password) {
          setAuthError('Please enter a valid username and password.');
          return;
        }
        if (users[uname]) {
          setAuthError('Username already exists. Please login instead.');
          return;
        }

        const passHash = await hashPassword(authInput.password);
        const newUser = {
          username: uname,
          passwordHash: passHash,
          name: authInput.name.trim() || uname,
          ageGroup: authInput.ageGroup,
          position: authInput.position,
          avatar: '🏉',
          xp: 0,
          streak: 1,
          waterLogged: 0,
          unlockedBadges: [],
          workoutLogs: []
        };

        setUsers(prev => ({ ...prev, [uname]: newUser }));
        setCurrentUsername(uname);
        setAuthInput({ username: '', password: '', name: '', ageGroup: 'U14', position: 'Back' });
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        const uname = authInput.username.trim().toLowerCase();
        if (!uname || !authInput.password) {
          setAuthError('Please enter both username and password.');
          return;
        }

        const user = users[uname];
        if (!user) {
          setAuthError('User not found. Please check your details or sign up.');
          return;
        }

        const passHash = await hashPassword(authInput.password);
        if (user.passwordHash !== passHash) {
          setAuthError('Incorrect password. Please try again.');
          return;
        }

        setCurrentUsername(uname);
        setAuthInput({ username: '', password: '', name: '', ageGroup: 'U14', position: 'Back' });
      };

      const handleSignOut = () => {
        setCurrentUsername(null);
        setActiveTab('dashboard');
      };

      // --- USER UPDATE HELPER ---
      const updateCurrentUser = (updater) => {
        if (!currentUsername) return;
        setUsers(prev => {
          const u = prev[currentUsername];
          if (!u) return prev;
          const updated = typeof updater === 'function' ? updater(u) : { ...u, ...updater };
          return { ...prev, [currentUsername]: updated };
        });
      };

      const triggerXpGain = (amount, title) => {
        updateCurrentUser(u => ({ ...u, xp: u.xp + amount }));
        setXpNotice({ show: true, amount, title });
      };

      // --- HYDRATION & LOGGING ---
      const addHydration = (amount) => {
        if (!currentUser) return;
        const newWater = currentUser.waterLogged + amount;
        updateCurrentUser({ waterLogged: newWater });
        triggerXpGain(25, `Logged ${amount}ml Hydration`);
      };

      const toggleExerciseCheck = (index) => {
        const isDone = !completedExercises[index];
        setCompletedExercises(prev => ({ ...prev, [index]: isDone }));
        if (isDone) {
          const ex = currentAgeData.exercises[index];
          triggerXpGain(ex.xp, `Completed ${ex.name}`);
        }
      };

      const handleFinishWorkout = () => {
        if (!currentUser) return;
        const logEntry = {
          date: new Date().toISOString().split('T')[0],
          ageGroup: currentUser.ageGroup,
          rpe: workoutRpe,
          duration: workoutDuration,
          completedCount: Object.keys(completedExercises).filter(k => completedExercises[k]).length
        };

        const bonusXp = 50 + (workoutRpe * 10);
        updateCurrentUser(u => ({
          ...u,
          streak: u.streak + 1,
          workoutLogs: [logEntry, ...(u.workoutLogs || [])]
        }));

        triggerXpGain(bonusXp, `Completed Workout Session (${workoutDuration}m, RPE ${workoutRpe}/10)`);
        setCompletedExercises({});
        if (webhookUrl) syncToGoogleSheet(logEntry);
      };

      const syncToGoogleSheet = async (latestLog = null) => {
        if (!webhookUrl) {
          setShowWebhookModal(true);
          return;
        }
        if (!currentUser) return;

        setSyncStatus('syncing');
        const log = latestLog || currentUser.workoutLogs?.[0] || {};
        
        const payload = {
          timestamp: new Date().toISOString(),
          username: currentUser.username,
          name: currentUser.name,
          ageGroup: currentUser.ageGroup,
          position: currentUser.position,
          xp: currentUser.xp,
          level: userLevel,
          streak: currentUser.streak,
          waterLogged: currentUser.waterLogged,
          sessionRpe: log.rpe || 'N/A',
          sessionDuration: log.duration || 'N/A',
          completedExercises: log.completedCount || 0
        };

        try {
          await fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSyncStatus('success');
          setTimeout(() => setSyncStatus(null), 3000);
        } catch (err) {
          setSyncStatus('error');
        }
      };

      const handleExportCSV = () => {
        if (!currentUser) return;
        const csvHeader = ['Timestamp', 'Username', 'Name', 'Age Category', 'Position', 'XP', 'Level', 'Streak', 'Hydration (ml)', 'Latest Session RPE', 'Duration (m)'];
        const latest = currentUser.workoutLogs?.[0] || {};
        const row = [
          new Date().toISOString(),
          `"${currentUser.username}"`,
          `"${currentUser.name}"`,
          currentUser.ageGroup,
          `"${currentUser.position}"`,
          currentUser.xp,
          userLevel,
          currentUser.streak,
          currentUser.waterLogged,
          latest.rpe || '-',
          latest.duration || '-'
        ].join(',');

        const csvContent = 'data:text/csv;charset=utf-8,' + [csvHeader.join(','), row].join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csvContent));
        link.setAttribute('download', `Core_Rugby_${currentUser.username}_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // ==========================================
      // RENDER AUTHENTICATION SCREEN IF NOT LOGGED IN
      // ==========================================
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-emerald-500 text-slate-950 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/20">
                  <ShieldIcon />
                </div>
                <h1 className="text-2xl font-black text-white tracking-tight">CORE RUGBY</h1>
                <p className="text-xs text-slate-400 font-medium">Youth S&C • Password Protected Athlete Portal</p>
              </div>

              {/* AUTH TOGGLE */}
              <div className="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-2xl border border-slate-800 text-xs font-bold">
                <button
                  onClick={() => { setAuthMode('login'); setAuthError(''); }}
                  className={`py-2.5 rounded-xl transition ${authMode === 'login' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400'}`}
                >
                  Sign In
                </button>
                <button
                  onClick={() => { setAuthMode('signup'); setAuthError(''); }}
                  className={`py-2.5 rounded-xl transition ${authMode === 'signup' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400'}`}
                >
                  Register
                </button>
              </div>

              {authError && (
                <div className="p-3 bg-red-500/10 border border-red-500/30 rounded-2xl text-red-400 text-xs text-center font-medium">
                  {authError}
                </div>
              )}

              {authMode === 'login' ? (
                <form onSubmit={handleLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Username / Email</label>
                    <input 
                      type="text" 
                      placeholder="e.g. ewan10" 
                      value={authInput.username}
                      onChange={e => setAuthInput({ ...authInput, username: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Password</label>
                    <input 
                      type="password" 
                      placeholder="••••••••" 
                      value={authInput.password}
                      onChange={e => setAuthInput({ ...authInput, password: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500"
                      required
                    />
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-2xl uppercase tracking-wider text-xs transition">
                    Secure Sign In
                  </button>
                </form>
              ) : (
                <form onSubmit={handleSignUp} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Full Name</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Ewan Devenish" 
                      value={authInput.name}
                      onChange={e => setAuthInput({ ...authInput, name: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500"
                      required
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 font-bold mb-1">Username</label>
                      <input 
                        type="text" 
                        placeholder="ewan10" 
                        value={authInput.username}
                        onChange={e => setAuthInput({ ...authInput, username: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 font-bold mb-1">Age Group</label>
                      <select 
                        value={authInput.ageGroup}
                        onChange={e => setAuthInput({ ...authInput, ageGroup: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500"

          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 border-t border-slate-800 backdrop-blur-md px-2 py-2">

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
